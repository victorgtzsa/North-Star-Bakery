<body>

<header>

<img src="bakery-logo_c.png" alt="North Star Bakery Logo" style="width:300px; height:auto" >

<nav>

<a href="products.html">Products</a> |

</nav>

</header>

<main>

<h1>Contact North Star Bakery</h1>

<section>

<h2>Inquiry & Pre-Order Request Form</h2>

<form action="#" method="post">

<p>
<label for="name">Name:</label><br>
<input type="text" id="name" name="name" required>
</p>

<p>
<label for="email" required>Email:</label><br>
<input type="email" id="email" name="email" required>
</p>

<p>
<label for="phone" pattern="[0-9]{10}">Phone Number:</label><br>
<input type="tel" id="phone" name="phone">
</p>
<figure>
  <img src="bakery-logo_c.png" alt="North Star Bakery Logo" style="width:50px; height:auto">
  <figcaption>
    Call us at <a href="tel:1234567890">(123) 456-7890</a> for assistance.
  </figcaption>
</figure>

<p>
<label for="request">Order or Inquiry Details:</label><br>
<textarea id="request" name="request" rows="6" cols="50" required></textarea>
</p>

<p>
<button type="submit">Submit Request</button>
</p>

</form>

</section>

<section>

<h2>Location Information</h2>

<p>
123 Main Street<br>
Your Town, USA
</p>

</section>

<section>

<h2>Hours of Operation</h2>

<p>
Monday - Friday: 6:00 AM - 6:00 PM<br>
Saturday: 7:00 AM - 5:00 PM<br>
Sunday: 7:00 AM - 2:00 PM
</p>

</section>

</main>

<footer>
<p>&copy; 2026 North Star Bakery</p>
</footer>

</body>
